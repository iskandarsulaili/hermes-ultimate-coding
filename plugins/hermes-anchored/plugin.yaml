name: hermes-anchored
version: "1.0.0"
description: "Anchored Standard — narrow the first model request to a minimal tool catalog (terminal, patch, dev_tool_search) to anchor the reasoning trajectory, then restore the full tool catalog from the second request on. Tool discovery via dev_tool_search. Enabled by default (HERMES_ANCHORED_ENABLED=0 to opt out). Ported from dsh-anchored-standard."
author: "Nous Research"
license: "MIT"
type: "plugin"
entry: "__init__.py"
